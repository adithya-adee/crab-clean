[package]
name = "crab-clean"
version = "0.2.0"
edition = "2024"
authors = ["Adithya A adithya25905@gmail.com"]
description = "An interactive TUI to tidy your file system: find and safely remove duplicate, old, and unused files"
documentation = "https://docs.rs/crab-clean"
readme = "README.md"
homepage = "https://github.com/adithya-adee/crab-clean"
repository = "https://github.com/adithya-adee/crab-clean"
license = "MIT"
keywords = ["tui", "filesystem", "duplicate-files", "cleanup", "ratatui"]
categories = ["command-line-utilities", "filesystem"]
exclude = ["tests/*", ".github/*", "*.md", "*.excalidraw", "*.png"]

[[bin]]
name = "crabclean"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
crossterm = "0.29.0"
dirs = "6.0.0"
humansize = "2.1.3"
ratatui = "0.30.1"
rayon = "1.10.0"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
thiserror = "2.0.18"
toml = "1.1.2"
trash = "5.2.6"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.0"
